name: Release

# On main: open or update the "Version Packages" pull request while changesets
# are pending. Once it merges, tag v<version> and package the release.
# A manually pushed v* tag packages that tag directly.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: github.ref_type == 'branch'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: github.ref_type == 'branch'

      - name: Version pull request
        id: changesets
        if: github.ref_type == 'branch'
        uses: changesets/action@v2
        with:
          version: npm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag new version
        id: tag
        if: github.ref_type == 'branch' && steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "$version already released."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Tags pushed with GITHUB_TOKEN do not start new workflows, so package here.
      - name: Package and upload
        if: steps.tag.outputs.created == 'true' || github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
